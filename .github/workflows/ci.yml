name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Smoke test CLI
        run: pgsgs select --domain coupled-process --max-cost 3.2 --max-energy 2.6
      - name: Smoke test benchmark
        run: python benchmarks/run_cross_domain.py --steps 30 --seeds 7 --output artifacts/ci-cross-domain.json
